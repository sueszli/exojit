import lit.formats
import os
import platform
import shlex
import sys

config.test_source_root = os.path.dirname(__file__)
exo_src = os.path.dirname(os.path.dirname(config.test_source_root))

config.test_format = lit.formats.ShTest(preamble_commands=[f"cd {exo_src}"])
config.name = "exojit"
config.suffixes = [".py"]

# active interpreter
python = shlex.quote(sys.executable)
config.environment["PYTHONPATH"] = os.pathsep.join(filter(None, (exo_src, os.environ.get("PYTHONPATH"))))
config.substitutions.append(("uv run exojit", f"{python} -c 'import exojit; exojit.cli()'"))
config.substitutions.append(("%python", python))

# lit drops toolchain env otherwise
for name in ("DEVELOPER_DIR", "MACOSX_DEPLOYMENT_TARGET"):
    if name in os.environ:
        config.environment[name] = os.environ[name]

# host features
if platform.machine() in ("arm64", "aarch64"):
    config.available_features.add("aarch64")
# any mac, missing deps must fail
if platform.system() == "Darwin":
    config.available_features.add("metal")
