[project]
name = "exojit"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "exo-lang @ git+https://github.com/exo-lang/exo.git@ec75d3c5b229b1519890f836e7badcd46b04c007",
    "xdsl @ git+https://github.com/xdslproject/xdsl.git@419203fd0bdf46338b74c51f337e143bc64c993b",
    "click",
    "cffi",
    "lit",
    "filecheck",
    "numpy",
    "pytest",
    "pytest-xdist",
    "pytest-forked",
    "llvmlite",
    "plotnine",
    "plotext",
    "polars",
    "pyarrow",
    "tqdm",
    "filelock",
    "jax",
    "numba",
    "torch",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exojit*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-n auto --forked -v"

[project.scripts]
exojit = "exojit.main:cli"

[tool.pyright]
# exo procedures are written in a python-shaped DSL whose names (f32, seq,
# stride, ...) only exist inside the @proc parser, so pyright cannot check them
exclude = ["exojit/neon.py", ".venv"]
