[project]
name = "exojit"
version = "0.1.0"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
    "exo-lang @ git+https://github.com/exo-lang/exo.git@ec75d3c5b229b1519890f836e7badcd46b04c007",
    "xdsl @ git+https://github.com/xdslproject/xdsl.git@ad4fb9c277a65993a1c988dfeea2b30c52b66db9",
    "tyro",
    "cffi",
    "numpy",
    "llvmlite",
    "pyobjc-framework-Metal; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "lit",
    "filecheck",
    "pytest",
    "pytest-xdist",
    "plotnine",
    "polars",
    "pyarrow",
    "tqdm",
    "jax",
    "optax",
    "numba",
    "torch",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["exojit", "backend_metal"]

[tool.pytest.ini_options]
addopts = "-n auto -v"

[project.scripts]
exojit = "exojit:cli"
